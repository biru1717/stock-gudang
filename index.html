<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCKBARANG - Manajemen Stok</title>
    <!-- CSS & Firebase SDK jika diperlukan -->
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js untuk Diagram -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Container Utama Aplikasi -->
    <div class="app-container">
        
        <!-- Header / Navigasi Atas -->
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>📦 STOCKBARANG</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="btnTheme" style="padding: 6px 12px; border-radius: 6px; cursor: pointer;">☀️ Light</button>
                <button id="btnTrx" style="background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">+ Catat Transaksi</button>
                <button id="btnAdd" style="background: #38bdf8; color: #0f172a; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">+ Tambah Barang</button>
            </div>
        </header>

        <!-- Kotak Statistik Atas -->
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <div class="stat" style="background: var(--bg-card); padding: 15px; border-radius: 8px; flex: 1;">
                <div style="font-size: 12px; color: var(--text-sub);">Total Jenis Barang</div>
                <div id="sTotal" style="font-size: 20px; font-weight: bold; color: var(--text-color);">0</div>
            </div>
            <div class="stat" style="background: var(--bg-card); padding: 15px; border-radius: 8px; flex: 1;">
                <div style="font-size: 12px; color: var(--text-sub);">Stok Menipis</div>
                <div id="sLow" style="font-size: 20px; font-weight: bold; color: #f59e0b;">0</div>
            </div>
            <div class="stat" style="background: var(--bg-card); padding: 15px; border-radius: 8px; flex: 1;">
                <div style="font-size: 12px; color: var(--text-sub);">Stok Habis</div>
                <div id="sOut" style="font-size: 20px; font-weight: bold; color: #ef4444;">0</div>
            </div>
        </div>

        <!-- Tab Navigasi & Pencarian -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <div id="tabs" style="display: flex; gap: 8px;">
                <button data-tab="stok" class="on" style="padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold;">Stok</button>
                <button data-tab="riwayat" style="padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold;">Riwayat</button>
            </div>
            <div>
                <input type="text" id="q" placeholder="Cari nama barang..." style="padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-color); width: 220px;">
            </div>
        </div>

        <!-- Filter Kategori -->
        <div id="filters"></div>

        <!-- Konten Utama (Dinamis dari app.js) -->
        <main id="main"></main>

    </div>

    <!-- Modal Login (Jika belum login) -->
    <dialog id="dLogin">
        <form id="fLogin">
            <h3>Login Aplikasi Stok</h3>
            <div style="margin-top: 10px;">
                <label>Username</label>
                <input type="text" id="uName" required style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            <div style="margin-top: 10px;">
                <label>Password</label>
                <input type="password" id="uPass" required style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            <p id="loginError" style="color: #ef4444; font-size: 12px; display: none; margin-top: 6px;">Username atau password salah!</p>
            <div style="margin-top: 20px; text-align: right;">
                <button type="submit" style="padding: 8px 16px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Login</button>
            </div>
        </form>
    </dialog>

    <!-- Modal Tambah Barang Baru -->
    <dialog id="dItem">
        <form id="fItem">
            <h3 id="tItemT">Tambah barang</h3>
            <div style="margin-top: 10px;">
                <label>Nama Barang</label>
                <input type="text" id="iNama" required style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            <div style="margin-top: 10px;">
                <label>Kategori</label>
                <select id="iKategori" style="width: 100%; padding: 8px; margin-top: 4px;">
                    <option value="FOOD">FOOD</option>
                    <option value="TOPPING">TOPPING</option>
                    <option value="SYRUP">SYRUP</option>
                    <option value="POwdER">POWDER</option>
                    <option value="BEANS">BEANS</option>
                    <option value="DRINK">DRINK</option>
                    <option value="UTILITY">UTILITY</option>
                    <option value="THERMAL">THERMAL</option>
                    <option value="STICKER">STICKER</option>
                    <option value="ASSET 1">ASSET 1</option>
                    <option value="CLEANLINESS">CLEANLINESS</option>
                    <option value="CUP & LID">CUP & LID</option>
                    <option value="TEA">TEA</option>
                    <option value="PLASTIC">PLASTIC</option>
                    <option value="DAIRY">DAIRY</option>
                    <option value="SAUCE">SAUCE</option>
                </select>
            </div>
            <div id="boxSubFood" style="margin-top: 10px; display: none;">
                <label>Sub Kategori Food</label>
                <select id="iSubFood" style="width: 100%; padding: 8px; margin-top: 4px;">
                    <option value="SANDWICH">SANDWICH</option>
                    <option value="POUND CAKE">POUND CAKE</option>
                    <option value="PASTRY">PASTRY</option>
                    <option value="ROLL CAKE">ROLL CAKE</option>
                </select>
            </div>
            <div style="margin-top: 10px;">
                <label>Deskripsi / Keterangan</label>
                <input type="text" id="iDesc" placeholder="Opsional" style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            <div style="margin-top: 10px; display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Stok Awal</label>
                    <input type="number" id="iStok" min="0" value="0" required style="width: 100%; padding: 8px; margin-top: 4px;">
                </div>
                <div style="flex: 1;">
                    <label>Satuan</label>
                    <input type="text" id="iSatuan" value="pcs" required style="width: 100%; padding: 8px; margin-top: 4px;">
                </div>
            </div>
            <div style="margin-top: 10px;">
                <label>Batas Minimum (Alert Stok Menipis)</label>
                <input type="number" id="iMin" min="1" value="5" required style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button type="button" class="cancel" style="padding: 8px 14px; border-radius: 6px; cursor: pointer;">Batal</button>
                <button type="submit" style="padding: 8px 14px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Simpan</button>
            </div>
        </form>
    </dialog>

    <!-- Modal Edit Stok Barang -->
    <dialog id="dEdit">
        <form id="fEdit">
            <h3>Edit Stok Barang</h3>
            <p id="pEditNama" style="font-size: 13px; color: var(--text-sub); margin-bottom: 10px;"></p>
            
            <label>Opsi Transaksi</label>
            <select id="eOpsi" style="width: 100%; padding: 8px; margin-top: 4px;">
                <option value="Transfer In">Transfer In (Tambah Stok)</option>
                <option value="Transfer Out">Transfer Out (Kurang Stok)</option>
                <option value="Kebutuhan Operasional">Kebutuhan Operasional (-)</option>
                <option value="Vendor">Vendor</option>
            </select>

            <div id="boxAksiVendor" style="display: none; margin-top: 10px;">
                <label>Aksi Vendor</label>
                <select id="eVendorAksi" style="width: 100%; padding: 8px; margin-top: 4px;">
                    <option value="tambah">Vendor In (Tambah Stok)</option>
                    <option value="kurang">Vendor Out (Kurang Stok)</option>
                </select>
            </div>

            <div id="boxStatusTito" style="margin-top: 10px;">
                <label>Status TITO</label>
                <select id="eStatusTito" style="width: 100%; padding: 8px; margin-top: 4px;">
                    <option value="Belum TITO">Belum TITO</option>
                    <option value="Sudah TITO">Sudah TITO</option>
                </select>
            </div>

            <div style="margin-top: 10px;">
                <label>Jumlah (Qty)</label>
                <input type="number" id="eQty" min="1" value="1" required style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>

            <div style="margin-top: 10px;">
                <label>Tanggal Expired (Opsional)</label>
                <input type="date" id="eExpired" style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>

            <!-- ID boxDesc agar deskripsi otomatis disembunyikan untuk Operasional & Vendor -->
            <div id="boxDesc" style="margin-top: 10px;">
                <label>Deskripsi / Catatan</label>
                <input type="text" id="eDesc" placeholder="Contoh: Mutasi gudang" style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button type="button" class="cancel" style="padding: 8px 14px; border-radius: 6px; cursor: pointer;">Batal</button>
                <button type="submit" style="padding: 8px 14px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Simpan Perubahan</button>
            </div>
        </form>
    </dialog>

    <!-- Modal Catat Transaksi Header -->
    <dialog id="dTrx">
        <form id="fTrx">
            <h3>Catat Transaksi Manual</h3>
            <div style="margin-top: 10px;">
                <label>Pilih Barang</label>
                <select id="tItem" required style="width: 100%; padding: 8px; margin-top: 4px;"></select>
            </div>
            <div style="margin-top: 10px;">
                <label>Jenis Transaksi</label>
                <div id="segT" style="display: flex; gap: 5px; margin-top: 4px;">
                    <button type="button" data-t="masuk" class="on" style="flex: 1; padding: 6px; cursor: pointer;">Masuk</button>
                    <button type="button" data-t="keluar" style="flex: 1; padding: 6px; cursor: pointer;">Keluar</button>
                </div>
            </div>
            <div style="margin-top: 10px;">
                <label>Jumlah</label>
                <div style="display: flex; gap: 5px; margin-top: 4px; align-items: center;">
                    <button type="button" id="mn" style="padding: 6px 12px; cursor: pointer;">-</button>
                    <input type="number" id="tQty" min="1" value="1" required style="flex: 1; text-align: center; padding: 6px;">
                    <button type="button" id="pl" style="padding: 6px 12px; cursor: pointer;">+</button>
                </div>
            </div>
            <div style="margin-top: 10px;">
                <label>Catatan / Keterangan</label>
                <input type="text" id="tCat" placeholder="Keterangan transaksi" style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button type="button" class="cancel" style="padding: 8px 14px; border-radius: 6px; cursor: pointer;">Batal</button>
                <button type="submit" style="padding: 8px 14px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Proses</button>
            </div>
        </form>
    </dialog>

    <!-- Modal Edit Riwayat TITO & Catatan -->
    <dialog id="dEditRiwayat">
        <form id="fEditRiwayat">
            <h3>Edit Status TITO & Catatan</h3>
            <p id="pEditRiwayatInfo" style="font-size: 13px; color: var(--text-sub); margin-bottom: 10px;"></p>
            <div style="margin-top: 10px;">
                <label>Status TITO</label>
                <select id="rStatusTito" style="width: 100%; padding: 8px; margin-top: 4px;">
                    <option value="Belum TITO">Belum TITO</option>
                    <option value="Sudah TITO">Sudah TITO</option>
                </select>
            </div>
            <div style="margin-top: 10px;">
                <label>Catatan</label>
                <input type="text" id="rCatatan" style="width: 100%; padding: 8px; margin-top: 4px;">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button type="button" class="cancel" style="padding: 8px 14px; border-radius: 6px; cursor: pointer;">Batal</button>
                <button type="submit" style="padding: 8px 14px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Simpan</button>
            </div>
        </form>
    </dialog>

    <!-- Modal Alert Stok Menipis / Habis (Solid / Tidak Transparan) -->
    <dialog id="dAlerts">
        <div style="padding: 20px; background: var(--bg-card); color: var(--text-color); border-radius: 12px; width: 400px; max-width: 90vw;">
            <h3 id="tAlertsTitle" style="color: #38bdf8; margin-bottom: 12px; font-size: 16px;">Daftar Stok</h3>
            <div id="contentAlertsList" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;"></div>
            <div style="text-align: right;">
                <button onclick="document.getElementById('dAlerts').close()" style="padding: 6px 14px; background: var(--border-color); color: var(--text-color); border: none; border-radius: 6px; cursor: pointer;">Tutup</button>
            </div>
        </div>
    </dialog>

    <!-- Script Utama -->
    <script src="app.js"></script>
</body>
</html>
